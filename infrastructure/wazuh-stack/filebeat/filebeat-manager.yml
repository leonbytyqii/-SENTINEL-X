# Wazuh Manager internal Filebeat — SENTINEL-X
# Ships Wazuh alerts to wazuh-indexer (OpenSearch) via the wazuh_stack_net network.
# Mounted into the manager at /etc/filebeat/filebeat.yml

filebeat.modules:
  - module: wazuh
    alerts:
      enabled: true
    archives:
      enabled: false

setup.template.json.enabled: true
setup.template.overwrite: true
setup.template.json.path: '/etc/filebeat/wazuh-template.json'
setup.template.json.name: 'wazuh-alerts-4.x'
setup.template.name: 'wazuh-alerts-4.x'
setup.template.pattern: 'wazuh-alerts-4.x-*'
setup.ilm.enabled: false

output.elasticsearch:
  hosts: ['https://wazuh-indexer:9200']
  username: 'admin'
  password: 'SecretPassword'
  ssl.certificate_authorities: ['/etc/filebeat/certs/root-ca.pem']
  ssl.certificate: '/etc/filebeat/certs/wazuh-manager.pem'
  ssl.key: '/etc/filebeat/certs/wazuh-manager.key'
  ssl.verification_mode: 'certificate'
  index: 'wazuh-alerts-4.x-%{+yyyy.MM.dd}'

logging.level: info
logging.metrics.enabled: false

seccomp:
  default_action: allow
  syscalls:
  - action: allow
    names:
    - rseq
