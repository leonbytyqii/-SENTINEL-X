# SENTINEL-X – Kibana configuration

server.host: "0.0.0.0"
server.port: 5601
server.name: "sentinel-kibana"

# ── Elasticsearch connection ──────────────────────────────────────────────────
elasticsearch.hosts: ["http://elasticsearch:9200"]
elasticsearch.username: "kibana_system"
elasticsearch.password: "${ELASTICSEARCH_PASSWORD}"
elasticsearch.requestTimeout: 30000

# ── Security (xpack.security.enabled removed in Kibana 8.x — always on) ──────
xpack.security.encryptionKey: "sentinel-x-encryption-key-32chars-min"
xpack.encryptedSavedObjects.encryptionKey: "sentinel-x-so-encryption-key-min32"
xpack.reporting.encryptionKey: "sentinel-x-reporting-encryption-key"

# ── Feature flags (disable unused features) ──────────────────────────────────
xpack.fleet.enabled: false
telemetry.enabled: false
newsfeed.enabled: false

# ── Logging ──────────────────────────────────────────────────────────────────
logging.appenders.default:
  type: console
  layout:
    type: json
logging.root.level: warn

# ── UI settings ──────────────────────────────────────────────────────────────
server.defaultRoute: "/app/dashboards"
