# SENTINEL-X – ModSecurity override configuration
# This file is included AFTER the base modsecurity.conf from the OWASP image.
# Only settings that differ from the image defaults are listed here.

# ── Engine ───────────────────────────────────────────────────────────────────
# Start in DetectionOnly. Switch to "On" after WAF validation is complete.
# Controlled via MODSEC_RULE_ENGINE env var in docker-compose.yml.
# SecRuleEngine DetectionOnly   # (set by MODSEC_RULE_ENGINE env var)

# ── Audit Logging ────────────────────────────────────────────────────────────
# Write audit log in JSON format for clean Wazuh parsing.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLog /var/log/modsecurity/audit.log
SecAuditLogFormat JSON
SecAuditLogParts ABCEFHIJKZ
SecAuditLogType Serial

# ── Request Body ─────────────────────────────────────────────────────────────
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 1310720
SecRequestBodyInMemoryLimit 131072
SecRequestBodyLimitAction Reject

# ── Response Body ────────────────────────────────────────────────────────────
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial

# ── PCRE limits ──────────────────────────────────────────────────────────────
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000

# ── Debug (set 0 in production) ──────────────────────────────────────────────
SecDebugLog /var/log/modsecurity/debug.log
SecDebugLogLevel 0

# ── Temporary file handling ──────────────────────────────────────────────────
SecTmpDir /tmp/modsecurity
SecDataDir /tmp/modsecurity
SecUploadDir /tmp/modsecurity
SecUploadKeepFiles Off
