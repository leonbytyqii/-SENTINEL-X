# SENTINEL-X – CRS setup override
# Applied after the base crs-setup.conf from the OWASP image.

# ── Paranoia Level ───────────────────────────────────────────────────────────
# Level 1: Default, balanced. Increase for stricter inspection.
# Controlled via PARANOIA env var in docker-compose.yml.
# SecAction "id:900000, phase:1, nolog, pass, t:none, setvar:tx.paranoia_level=1"

# ── Anomaly Scoring Thresholds ───────────────────────────────────────────────
# Inbound: requests scoring >= this are blocked (DetectionOnly: logged only)
# Outbound: responses scoring >= this are blocked
# Controlled via ANOMALY_INBOUND and ANOMALY_OUTBOUND env vars.
# SecAction "id:900110, phase:1, nolog, pass, t:none, setvar:tx.inbound_anomaly_score_threshold=5"
# SecAction "id:900120, phase:1, nolog, pass, t:none, setvar:tx.outbound_anomaly_score_threshold=4"

# ── Allowed HTTP Methods ─────────────────────────────────────────────────────
SecAction \
    "id:900200, \
    phase:1, \
    nolog, \
    pass, \
    t:none, \
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT DELETE PATCH'"

# ── Allowed Request Content Types ────────────────────────────────────────────
SecAction \
    "id:900220, \
    phase:1, \
    nolog, \
    pass, \
    t:none, \
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |application/json| |text/plain| |text/xml|'"

# ── Block specific file extensions ───────────────────────────────────────────
SecAction \
    "id:900240, \
    phase:1, \
    nolog, \
    pass, \
    t:none, \
    setvar:'tx.restricted_extensions=.asa/ .asax/ .ascx/ .backup/ .bak/ .bat/ .cdx/ .cer/ .cfg/ .cmd/ .com/ .config/ .dll/ .exe/ .ini/ .key/ .pem/'"
