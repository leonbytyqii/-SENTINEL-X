# SENTINEL-X – ModSecurity overrides
# This file is included AFTER modsecurity.conf in setup.conf, so directives here
# take precedence over the base configuration.

# Override SecAuditLog to write inside /var/log/modsecurity/audit/ which the
# nginx worker (uid 999) can write to. The parent /var/log/modsecurity/ is
# root-owned (755) so the worker cannot create files directly there.
SecAuditLog /var/log/modsecurity/audit/modsec_audit.log
