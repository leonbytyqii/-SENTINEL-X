# SENTINEL-X – nginx reverse proxy + security headers
# This file overlays the default owasp/modsecurity-crs configuration.
# The BACKEND env var in docker-compose routes traffic to the webapp service.

# JSON structured access log format (parsed by Wazuh)
log_format json_access escape=json
    '{'
        '"@timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_length":$request_length,'
        '"request_time":$request_time,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

server {
    listen 8080;
    server_name _;

    # ── Access and Error Logging ─────────────────────────────────────────────
    access_log /var/log/nginx/access.log json_access;
    error_log  /var/log/nginx/error.log  warn;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-XSS-Protection          "1; mode=block"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # Note: HSTS omitted — no TLS in this lab deployment.

    # ── Hide server version ──────────────────────────────────────────────────
    server_tokens off;

    # ── Request limits ───────────────────────────────────────────────────────
    client_max_body_size    10m;
    client_body_timeout     30s;
    client_header_timeout   30s;
    keepalive_timeout       75s;
    send_timeout            30s;

    # ── Health check endpoint (not proxied to app — fast nginx response) ─────
    location = /health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx-waf"}';
        add_header Content-Type application/json;
    }

    # ── Main proxy to protected webapp ───────────────────────────────────────
    location / {
        proxy_pass         http://webapp:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;

        # Remove upstream server info from response headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # ── Block common scanner paths ───────────────────────────────────────────
    location ~* \.(git|env|htaccess|htpasswd|DS_Store)$ {
        deny all;
        return 404;
    }
}
