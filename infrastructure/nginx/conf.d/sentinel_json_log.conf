# SENTINEL-X – JSON access log format for Wazuh ingestion
# Added alongside the existing 'main' combined-format log in logging.conf.
# Wazuh decoder 'sentinel-nginx-json' matches the {"@timestamp" prefix.

log_format json_waf escape=json
    '{"@timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"user_agent":"$http_user_agent",'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr"}';

# Second access_log alongside the existing combined log — both are written.
access_log /var/log/nginx/access_json.log json_waf;
